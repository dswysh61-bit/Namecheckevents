<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול נוכחות באירועים</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f5f6fa; color: #1e293b; }
  header { background: #1e2a4a; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  header button { background: transparent; border: 1px solid #ffffff55; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 14px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  input[type=text], input[type=date], input[type=search] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; margin-bottom: 10px; }
  .btn { display: inline-block; background: #1e2a4a; color: #fff; border: none; border-radius: 10px; padding: 12px 16px; font-size: 16px; cursor: pointer; }
  .btn.secondary { background: #e2e8f0; color: #1e293b; }
  .btn.danger { background: #dc2626; }
  .btn.full { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .event { display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 10px; cursor: pointer; background: #fff; }
  .event small { color: #64748b; }
  .stats { display: flex; gap: 10px; text-align: center; }
  .stat { flex: 1; background: #eef2f9; border-radius: 12px; padding: 12px 6px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 13px; color: #475569; }
  .bar { height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin-top: 12px; }
  .bar div { height: 100%; background: #16a34a; transition: width .3s; }
  .guest { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; user-select: none; }
  .guest:last-child { border-bottom: none; }
  .guest.in { background: #f0fdf4; }
  .check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; flex-shrink: 0; }
  .guest.in .check { background: #16a34a; border-color: #16a34a; }
  .guest .time { font-size: 12px; color: #16a34a; margin-top: 2px; }
  .empty { text-align: center; color: #64748b; padding: 20px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; font-size: 14px; }
  .tabs button.active { background: #1e2a4a; color: #fff; border-color: #1e2a4a; }
  .note { font-size: 13px; color: #64748b; margin-top: 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <button id="backBtn" class="hidden" onclick="showHome()">→ חזרה</button>
  <h1 id="title">ניהול נוכחות באירועים</h1>
</header>

<main>
  <!-- מסך ראשי: רשימת אירועים -->
  <section id="home">
    <div class="card">
      <h2>אירוע חדש</h2>
      <input type="text" id="newName" placeholder="שם האירוע">
      <input type="date" id="newDate">
      <button class="btn full" onclick="createEvent()">יצירת אירוע</button>
    </div>
    <div id="eventsList"></div>
    <p class="note">הנתונים נשמרים רק במכשיר הזה ובדפדפן הזה. אין שרת ואין צורך בהתחברות.</p>
  </section>

  <!-- מסך אירוע -->
  <section id="eventView" class="hidden">
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="sTotal">0</b><span>מוזמנים</span></div>
        <div class="stat"><b id="sIn">0</b><span>הגיעו</span></div>
        <div class="stat"><b id="sPct">0%</b><span>נוכחות</span></div>
      </div>
      <div class="bar"><div id="sBar" style="width:0%"></div></div>
    </div>

    <div class="card">
      <h2>העלאת רשימת אורחים</h2>
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" class="hidden" onchange="importFile(this)">
      <button class="btn full" onclick="document.getElementById('fileInput').click()">בחירת קובץ Excel / CSV</button>
      <p class="note">עמודה ראשונה: שם פרטי, עמודה שנייה: שם משפחה. שורת כותרת תזוהה ותדולג אוטומטית.</p>
      <div class="row" style="margin-top:10px">
        <input type="text" id="addFirst" placeholder="שם פרטי">
        <input type="text" id="addLast" placeholder="שם משפחה">
      </div>
      <button class="btn secondary full" onclick="addGuest()">הוספת אורח ידנית</button>
    </div>

    <div class="card">
      <input type="search" id="search" placeholder="חיפוש אורח..." oninput="renderGuests()">
      <div class="tabs">
        <button data-f="all" class="active" onclick="setFilter('all')">כולם</button>
        <button data-f="out" onclick="setFilter('out')">טרם הגיעו</button>
        <button data-f="in" onclick="setFilter('in')">הגיעו</button>
      </div>
      <div id="guestList"></div>
    </div>

    <div class="row">
      <button class="btn secondary" onclick="exportCSV()">ייצוא נוכחות</button>
      <button class="btn danger" onclick="deleteEvent()">סיום ומחיקת האירוע</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const KEY = 'attendance_events_v1';
let events = load();
let currentId = null;
let filter = 'all';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(events)); }
  catch (e) { toast('שגיאה בשמירה במכשיר'); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function cur() { return events.find(e => e.id === currentId); }

/* ---------- אירועים ---------- */
function createEvent() {
  const name = document.getElementById('newName').value.trim();
  const date = document.getElementById('newDate').value;
  if (!name) return toast('יש להזין שם לאירוע');
  const ev = { id: uid(), name, date, guests: [] };
  events.unshift(ev); save();
  document.getElementById('newName').value = '';
  openEvent(ev.id);
}

function renderEvents() {
  const el = document.getElementById('eventsList');
  if (!events.length) { el.innerHTML = '<div class="empty">אין עדיין אירועים</div>'; return; }
  el.innerHTML = events.map(ev => {
    const inC = ev.guests.filter(g => g.in).length;
    const d = ev.date ? new Date(ev.date).toLocaleDateString('he-IL') : '';
    return `<div class="event" onclick="openEvent('${ev.id}')">
      <div><b>${esc(ev.name)}</b><br><small>${d}</small></div>
      <small>${inC}/${ev.guests.length} הגיעו</small>
    </div>`;
  }).join('');
}

function openEvent(id) {
  currentId = id; filter = 'all';
  document.getElementById('home').classList.add('hidden');
  document.getElementById('eventView').classList.remove('hidden');
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('title').textContent = cur().name;
  document.getElementById('search').value = '';
  setFilter('all');
  window.scrollTo(0, 0);
}

function showHome() {
  currentId = null;
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('eventView').classList.add('hidden');
  document.getElementById('backBtn').classList.add('hidden');
  document.getElementById('title').textContent = 'ניהול נוכחות באירועים';
  renderEvents();
}

function deleteEvent() {
  const ev = cur();
  if (!confirm(`למחוק את "${ev.name}" ואת כל רשימת האורחים שלו?`)) return;
  events = events.filter(e => e.id !== currentId); save();
  toast('האירוע נמחק');
  showHome();
}

/* ---------- אורחים ---------- */
function addGuest() {
  const f = document.getElementById('addFirst').value.trim();
  const l = document.getElementById('addLast').value.trim();
  if (!f && !l) return toast('יש להזין שם');
  cur().guests.push({ id: uid(), first: f, last: l, in: false, time: null });
  save();
  document.getElementById('addFirst').value = '';
  document.getElementById('addLast').value = '';
  renderGuests(); toast('האורח נוסף');
}

function toggle(gid) {
  const g = cur().guests.find(x => x.id === gid);
  g.in = !g.in;
  g.time = g.in ? new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : null;
  save(); renderGuests();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderGuests();
}

function renderGuests() {
  const ev = cur(); if (!ev) return;
  const total = ev.guests.length;
  const inC = ev.guests.filter(g => g.in).length;
  const pct = total ? Math.round(inC / total * 100) : 0;
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sIn').textContent = inC;
  document.getElementById('sPct').textContent = pct + '%';
  document.getElementById('sBar').style.width = pct + '%';

  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = ev.guests.filter(g => {
    if (filter === 'in' && !g.in) return false;
    if (filter === 'out' && g.in) return false;
    if (q && !(`${g.first} ${g.last}`.toLowerCase().includes(q))) return false;
    return true;
  });
  list.sort((a, b) => (a.last + a.first).localeCompare(b.last + b.first, 'he'));

  const el = document.getElementById('guestList');
  if (!total) { el.innerHTML = '<div class="empty">אין אורחים עדיין. העלה קובץ או הוסף ידנית.</div>'; return; }
  if (!list.length) { el.innerHTML = '<div class="empty">לא נמצאו אורחים</div>'; return; }
  el.innerHTML = list.map(g => `
    <div class="guest ${g.in ? 'in' : ''}" onclick="toggle('${g.id}')">
      <div><div>${esc(g.first)} ${esc(g.last)}</div>${g.in ? `<div class="time">הגיע/ה ב-${g.time}</div>` : ''}</div>
      <div class="check">${g.in ? '✓' : ''}</div>
    </div>`).join('');
}

/* ---------- ייבוא קובץ ---------- */
function importFile(input) {
  const file = input.files[0]; if (!file) return;
  if (typeof XLSX === 'undefined') { toast('ספריית האקסל לא נטענה — בדוק חיבור לאינטרנט'); return; }
  const isCSV = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let wb;
      if (isCSV) {
        const buf = new Uint8Array(e.target.result);
        let text = new TextDecoder('utf-8').decode(buf);
        if (text.includes('�')) text = new TextDecoder('windows-1255').decode(buf); // קובץ עברית ישן מאקסל
        wb = XLSX.read(text.replace(/^﻿/, ''), { type: 'string' });
      } else {
        wb = XLSX.read(e.target.result, { type: 'array' });
      }
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      addRows(rows);
    } catch (err) { toast('לא הצלחתי לקרוא את הקובץ'); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function addRows(rows) {
  rows = rows.map(r => r.map(c => String(c).trim())).filter(r => r.some(c => c));
  if (!rows.length) return toast('הקובץ ריק');

  let fi = 0, li = 1, start = 0;
  const head = rows[0].map(c => c.toLowerCase());
  const isHeader = head.some(c => /שם|name|first|last|משפחה/.test(c));
  if (isHeader) {
    start = 1;
    const f = head.findIndex(c => /פרטי|first/.test(c));
    const l = head.findIndex(c => /משפחה|last|surname/.test(c));
    if (f >= 0) fi = f;
    if (l >= 0) li = l; else if (f < 0) li = -1; // עמודת "שם" אחת בלבד
  }

  const ev = cur();
  const existing = new Set(ev.guests.map(g => (g.first + '|' + g.last).toLowerCase()));
  let added = 0, dup = 0;
  for (const r of rows.slice(start)) {
    let first = r[fi] || '', last = li >= 0 ? (r[li] || '') : '';
    if (li < 0 || (!last && first.includes(' '))) { // שם מלא בעמודה אחת
      const parts = first.split(/\s+/); first = parts.shift(); last = parts.join(' ');
    }
    if (!first && !last) continue;
    const k = (first + '|' + last).toLowerCase();
    if (existing.has(k)) { dup++; continue; }
    existing.add(k);
    ev.guests.push({ id: uid(), first, last, in: false, time: null });
    added++;
  }
  save(); renderGuests();
  toast(`נוספו ${added} אורחים` + (dup ? ` (${dup} כפולים דולגו)` : ''));
}

/* ---------- ייצוא ---------- */
function exportCSV() {
  const ev = cur();
  const lines = [['שם פרטי', 'שם משפחה', 'הגיע', 'שעה']];
  ev.guests.forEach(g => lines.push([g.first, g.last, g.in ? 'כן' : 'לא', g.time || '']));
  const csv = '﻿' + lines.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `נוכחות - ${ev.name}.csv`;
  a.click();
}

document.getElementById('newDate').value = new Date().toISOString().slice(0, 10);
renderEvents();
</script>
</body>
</html>
