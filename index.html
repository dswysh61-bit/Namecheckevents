<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול נוכחות באירועים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --navy:#1A2B4C; --navy-2:#24396A; --navy-3:#2F4C8A; --navy-soft:#EEF2F9;
  --bg:#FFFFFF; --surface:#F7F8FA; --surface-2:#F1F3F6; --border:#E4E7EC; --border-2:#D0D5DD;
  --text:#101828; --text-2:#344054; --muted:#667085; --faint:#98A2B3;
  --green:#0E7A55; --green-bg:#E8F6F0; --red:#B42318; --red-bg:#FDEDEC; --amber:#B54708; --amber-bg:#FEF4E6;
  --radius:10px; --radius-sm:7px; --shadow:0 1px 2px rgba(16,24,40,.05); --shadow-lg:0 12px 32px rgba(16,24,40,.14);
  --side:256px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--text);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-3);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:16px} h3{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* Layout */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800}
.brand-name{font-weight:700;font-size:15px;line-height:1.2}
.brand-sub{font-size:12px;color:#AFC0DE}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;color:#D5DEEE;padding:10px 12px;border-radius:8px;font-weight:500;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.07);text-decoration:none;color:#fff}
.nav a.active{background:rgba(255,255,255,.13);color:#fff}
.nav svg{width:19px;height:19px;flex:none;opacity:.9}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0;font-size:13px;color:#C3CFE6}
.side-foot .who{font-weight:600;color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ADE80;margin-inline-end:6px;vertical-align:middle}
.dot.off{background:#F59E0B}
.locked .side,.locked .topbar,.locked .scrim{display:none!important}
.locked .app{grid-template-columns:1fr}
.logout{margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:5px 12px;font-size:13px;cursor:pointer}
.logout:hover{background:rgba(255,255,255,.1)}
.main{min-width:0;padding:28px 36px 60px;max-width:1360px;width:100%}
.topbar{display:none}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--border-2);background:#fff;color:var(--text-2);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none!important;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn svg{width:16px;height:16px}
.icon-btn{width:32px;height:32px;border-radius:7px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:16px;height:16px}

/* Cards / KPI */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-head .hint{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .k-label{font-size:13px;color:var(--muted);font-weight:500}
.kpi .k-val{font-size:28px;font-weight:700;margin-top:4px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi .k-sub{font-size:12.5px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.accent{background:var(--navy);border-color:var(--navy)}
.kpi.accent .k-label{color:#B9C7E2}.kpi.accent .k-val{color:#fff}.kpi.accent .k-sub{color:#9FB1D6}
.grid-2{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.grid-2e{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chart-box{position:relative;padding:14px 18px 18px}
.stack{display:flex;flex-direction:column;gap:18px}

/* Tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:start;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface)}
.tbl .muted{color:var(--muted);font-size:13px}
.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums}
.t-name{font-weight:600;color:var(--text)}
.rate{display:flex;align-items:center;gap:10px;min-width:140px}
.rate .bar{flex:1;height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.rate .bar i{display:block;height:100%;background:var(--navy-3);border-radius:5px}
.rate .bar i.low{background:#A0AEC8}
.rate b{font-weight:600;font-size:13.5px;min-width:46px;text-align:end;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.no{background:var(--surface-2);color:var(--muted)}
.pill.err{background:var(--red-bg);color:var(--red)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.info{background:var(--navy-soft);color:var(--navy-3)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13.5px;font-weight:600;color:var(--text-2)}
.field .req{color:var(--red)}
.input,select.input,textarea.input{height:42px;border:1px solid var(--border-2);border-radius:8px;padding:0 12px;background:#fff;outline:none;width:100%;transition:border-color .12s,box-shadow .12s}
textarea.input{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(47,76,138,.15)}
.input.bad{border-color:var(--red)}
.err-msg{color:var(--red);font-size:13px}
.help{color:var(--muted);font-size:12.5px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search .input{padding-inline-start:40px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:34px;padding:0 13px;border-radius:6px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(16,24,40,.1)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--navy)}
.tabs .cnt{display:inline-block;background:var(--navy-soft);color:var(--navy-3);border-radius:10px;padding:0 7px;font-size:12px;margin-inline-start:6px}

/* Drop zone */
.drop{border:1.5px dashed var(--border-2);border-radius:var(--radius);padding:28px 20px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop.over{border-color:var(--navy-3);background:var(--navy-soft)}
.drop svg{width:34px;height:34px;color:var(--navy-3)}
.drop .d-title{font-weight:600;margin-top:8px}
.drop .d-sub{color:var(--muted);font-size:13px;margin-top:2px}
.file-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-bottom:12px}
.file-chip .fn{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px;align-items:end}
.sum-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.preview{max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.preview .tbl td{padding:8px 14px}
.preview tr.bad td{background:#FFF8F7}

/* Check-in */
.ev-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.ev-meta{color:var(--muted);font-size:14px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 1.4fr;gap:12px;margin-bottom:16px}
.stat{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:#fff}
.stat .s-l{font-size:13px;color:var(--muted);font-weight:500}
.stat .s-v{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat.present .s-v{color:var(--green)} .stat.absent .s-v{color:var(--text-2)}
.stat.rate{background:var(--navy);border-color:var(--navy);color:#fff}
.stat.rate .s-l{color:#B9C7E2}
.prog{height:8px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden;margin-top:8px;position:relative}
.prog i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .25s}
.prog .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:#F5B544}
.checkin{}
.ci-tools{position:sticky;top:0;z-index:5;background:#fff}
.ci-search .input{height:50px;font-size:17px}
.g-head,.g-row{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 110px 96px 44px;align-items:center}
.g-head{background:var(--surface);border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);height:40px}
.g-head span{padding:0 10px}
.g-row{min-height:58px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.g-row:hover{background:var(--surface)}
.g-row.on{background:#F3FAF7}
.g-row.on:hover{background:#EAF6F0}
.g-row>span{padding:0 10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-first,.g-last{font-weight:600;font-size:15.5px}
.g-time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.g-check{display:grid;place-items:center}
.g-check input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:28px;height:28px;border:2px solid var(--border-2);border-radius:7px;display:grid;place-items:center;background:#fff;transition:all .1s}
.box svg{width:18px;height:18px;color:#fff;opacity:0}
.g-row.on .box{background:var(--green);border-color:var(--green)}
.g-row.on .box svg{opacity:1}
.g-check input:focus-visible+.box{box-shadow:0 0 0 3px rgba(47,76,138,.3)}
.g-row.ro{cursor:default}
.g-remove{opacity:.55}
.g-row:hover .g-remove{opacity:1}
.list-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.list-foot{padding:12px 16px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hide-m{}
@media (max-width:720px){.hide-m{display:none}}
.kbd{display:inline-block;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:#fff;color:var(--text-2)}

/* Event cards (events list) */
.ev-name{font-weight:600;color:var(--text)}
.ev-name:hover{color:var(--navy-3)}
.row-actions{display:flex;gap:2px;justify-content:flex-end}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:fade .12s}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-head h2{font-size:17px}
.modal-body{padding:20px 22px;overflow:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-start;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
.menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:120;min-width:200px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;padding:9px 12px;border-radius:7px;cursor:pointer;text-align:start;font-weight:500;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.menu svg{width:16px;height:16px;color:var(--muted)}

/* Toast / banner */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;box-shadow:var(--shadow-lg);font-weight:500;font-size:14px;animation:fade .15s;max-width:90vw}
.toast.success{background:#0E6B4B}.toast.error{background:var(--red)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:9px;margin-bottom:16px;font-size:14px;border:1px solid}
.banner.warn{background:var(--amber-bg);border-color:#F8D9AE;color:#7A2E0E}
.banner.info{background:var(--navy-soft);border-color:#D3DDF0;color:var(--navy-2)}
.banner.error{background:var(--red-bg);border-color:#F6C9C5;color:#7A1A12}

.empty{padding:48px 24px;text-align:center}
.empty .e-ico{width:56px;height:56px;border-radius:14px;background:var(--navy-soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--navy-3)}
.empty .e-ico svg{width:28px;height:28px}
.empty h3{font-size:17px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:420px}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--navy);transition:width .2s}
.gate{max-width:520px;margin:12vh auto;text-align:center}
.pick-list{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.pick-list label{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.pick-list label:hover{background:var(--surface)}
.pick-list input{width:18px;height:18px;accent-color:var(--navy)}
.summary-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--navy-soft);border-radius:var(--radius);margin-top:18px}
.summary-bar b{color:var(--navy)}
.mini-kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.mini-kv div{background:var(--surface);border-radius:8px;padding:10px 12px}
.mini-kv span{display:block;font-size:12px;color:var(--muted)}
.mini-kv b{font-size:20px;font-variant-numeric:tabular-nums}
.dup-group{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hl{display:flex;flex-direction:column;gap:2px}
.hl .big{font-size:18px;font-weight:700;color:var(--navy)}
.small{font-size:13px}.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Responsive */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-2,.grid-2e{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .stat.rate{grid-column:1/-1}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:90;transform:translateX(100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:80;display:none}
  .scrim.show{display:block}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding:10px 14px}
  .topbar .icon-btn{color:#fff}
  .topbar .icon-btn:hover{background:rgba(255,255,255,.1)}
  .topbar .t-title{font-weight:700}
  .main{padding:18px 16px 60px}
  .ci-tools{top:52px}
}
@media (max-width:720px){
  h1{font-size:21px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .k-val{font-size:23px}
  .kpis .kpi.accent{grid-column:1/-1}
  .form-grid,.map-row{grid-template-columns:1fr}
  .mini-kv{grid-template-columns:repeat(2,1fr)}
  .tbl.cards thead{display:none}
  .tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:100%}
  .tbl.cards tr{padding:12px 14px;border-bottom:1px solid var(--border)}
  .tbl.cards td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:10px;text-align:start!important}

    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));

const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCsv = rows => '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function eventRows(ev) {
  const p = presentMap(ev.id);
  const list = (ev.guests || []).map(g => ({ g, id: g.id, at: p[g.id] || null }));
  list.sort((a, b) => collator.compare(a.g?.last || '', b.g?.last || '') || collator.compare(a.g?.first || '', b.g?.first || ''));
  return [['שם פרטי', 'שם משפחה', 'נוכחות', 'שעת הגעה']].concat(list.map(x => [x.g?.first || '', x.g?.last || '', x.at ? 'נוכח' : 'נעדר', x.at ? fmtTime(x.at) : '']));
}
async function exportEvent(ev, kind) {
  const base = safeFile(ev.name + ' ' + (ev.date || ''));
  if (kind === 'csv') return saveFile(base + '.csv', toCsv(eventRows(ev)));
  if (!window.XLSX) return toast('רכיב Excel לא נטען', 'error');
  const s = evStats(ev);
  const data = xlsxBook([
    { name: 'רשימת נוכחות', rows: eventRows(ev), cols: [{ wch: 16 }, { wch: 18 }, { wch: 10 }, { wch: 11 }] },
    { name: 'סיכום', rows: [['שדה', 'ערך'], ['שם האירוע', ev.name], ['תאריך', fmtDate(ev.date)], ['מיקום', ev.location || ''], ['סה״כ מוזמנים', s.total], ['נוכחים', s.present], ['נעדרים', s.absent], ['אחוז נוכחות', Math.round(s.rate * 10) / 10 + '%']], cols: [{ wch: 16 }, { wch: 34 }] }
  ]);
  return saveFile(base + '.xlsx', data);
}

function readEventFields(root, excludeId) {
  const get = n => $(`[name=${n}]`, root).value;
  const v = { name: normName(get('name')), date: get('date'), time: get('time') || '', location: normName(get('location')), notes: String(get('notes') || '').trim() };
  $$('.input', root).forEach(i => i.classList.remove('bad'));
  let err = '';
  if (!v.name) { err = 'יש להזין שם לאירוע.'; $('[name=name]', root).classList.add('bad'); }
  else if (v.name.length < 2) { err = 'שם האירוע קצר מדי.'; $('[name=name]', root).classList.add('bad'); }
  else if (!parseDate(v.date)) { err = 'יש לבחור תאריך תקין.'; $('[name=date]', root).classList.add('bad'); }
  else if (v.time && !/^\d{2}:\d{2}$/.test(v.time)) { err = 'שעה לא תקינה.'; $('[name=time]', root).classList.add('bad'); }
  else {
    const clash = [...S.events.values()].find(e => e.id !== excludeId && e.date === v.date && (e.name || '').trim().toLowerCase() === v.name.toLowerCase());
    if (clash) { err = 'כבר קיים אירוע בשם זה באותו תאריך. בחרו שם או תאריך אחר.'; $('[name=name]', root).classList.add('bad'); }
  }
  $('[data-err]', root).textContent = err;
  return err ? null : v;
}

async function createEvent(v, guests) {
  const id = genId('e');
  const now = Date.now();
  if (JSON.stringify(guests).length > 230000) throw new Error('הרשימה גדולה מדי לאירוע אחד (מעל כ-5,000 אורחים).');
  const data = Object.assign({}, v, { guests, closed: false, createdAt: now, updatedAt: now });
  await withRetry(() => refAtt(id).set({ present: {}, updatedAt: now }));
  await withRetry(() => refEvent(id).set(data));
  S.att.set(id, {}); S.events.set(id, Object.assign({ id }, data)); changed();
  return id;
}

  update() { if (this.tab === 'copy') this.renderPane(true); if ($('#cf-total')) this.sum(); },
  renderPane(soft) {
    if (this.tab !== 'copy') return;
    const pane = $('[data-pane=copy]');
    if (soft && pane.firstChild) return;
    const evs = sortedEvents('desc').filter(e => !e.closed && (e.guests || []).length);
    pane.innerHTML = evs.length ? `<div class="field"><label>העתקת רשימת המוזמנים מאירוע</label><select class="input" id="cp-sel"><option value="">— בחרו אירוע —</option>${evs.map(e => `<option value="${e.id}" ${e.id === this.copyFrom ? 'selected' : ''}>${esc(e.name)} · ${fmtDate(e.date)} (${fmtNum(e.guests.length)})</option>`).join('')}</select><span class="help">רק השמות מועתקים — הנוכחות מתחילה מאפס. אירועים שהסתיימו אינם זמינים כי השמות שלהם נמחקו.</span></div>` : '<div class="muted">אין אירועים פעילים עם רשימת מוזמנים להעתקה.</div>';
    const sel = $('#cp-sel'); if (sel) sel.onchange = () => { this.copyFrom = sel.value; this.sum(); };
  },
  collect() {
    const items = [];
    const r = this.importRes;
    if (r && r.valid) items.push(...r.valid);
    items.push(...(this.manualItems || []).filter(i => i.status === 'new'));
    const src = this.copyFrom && S.events.get(this.copyFrom);
    if (src && !src.closed) items.push(...(src.guests || []));
    return makeGuests(items, []);
  },
  sum() {
    $('#cf-total').textContent = fmtNum(this.collect().length);
    $('#cnt-file').textContent = fmtNum(this.importRes?.valid?.length || 0);
    $('#cnt-manual').textContent = fmtNum((this.manualItems || []).filter(i => i.status === 'new').length);
    $('#cnt-copy').textContent = fmtNum(this.copyFrom ? (S.events.get(this.copyFrom)?.guests || []).length : 0);
  },
  async submit() {
    if (!S.canWrite) return toast('אין לכם הרשאת עריכה', 'error');
    const v = readEventFields($('#cf-fields'), null);
    if (!v) { $('#cf-fields').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    const btn = $('#cf-submit'); btn.disabled = true;
    try {
      const guests = this.collect();
      const id = await createEvent(v, guests);
      toast(`האירוע נוצר עם ${fmtNum(guests.length)} מוזמנים`, 'success');
      location.hash = 'event-' + id;
    } catch (e) { console.error(e); toast(e.message && !e.code ? e.message : dbErrText(e), 'error'); }
    finally { btn.disabled = false; }
  }
};

      <div class="stats">

    $('#ci-sort').value = this.sort;

      if (e.key === 'Enter') {

        if (list.length === 1 && this.q.trim()) {
          const g = list[0];
          if (g.at) toast(`${guestName(g.g)} כבר סומן כנוכח`, '');
          else { setPresence(this.id, g.id, true); toast(`✓ ${guestName(g.g)} סומן כנוכח`, 'success'); }
          q.value = ''; this.q = ''; this.renderRows(); q.focus();
        } else if (list.length > 1) toast(`נמצאו ${fmtNum(list.length)} תוצאות — המשיכו להקליד או סמנו ידנית`);
        else toast('לא נמצא אורח בשם זה');
      }
    };
    $$('#ci-f button').forEach(b => b.onclick = () => { this.filter = b.dataset.f; $$('#ci-f button').forEach(x => x.classList.toggle('on', x === b)); this.renderRows(); });
    $('#ci-sort').onchange = e => { this.sort = e.target.value; this.renderRows(); };
    const body = $('#ci-body');
    body.addEventListener('change', e => {
      if (!e.target.matches('input[type=checkbox]')) return;
      const row = e.target.closest('.g-row');
      setPresence(this.id, row.dataset.id, e.target.checked);
    });
    body.addEventListener('click', e => {

      const more = e.target.closest('[data-more]');
      if (more) { this.limit += 600; this.renderRows(); }
    });
    $('#e-exp').onclick = e => { e.stopPropagation(); const ev = S.events.get(this.id); showMenu($('#e-exp'), [
      { label: 'ייצוא ל-Excel (xlsx)', icon: ICON.dl, onClick: () => exportEvent(ev, 'xlsx') },
      { label: 'ייצוא ל-CSV', icon: ICON.dl, onClick: () => exportEvent(ev, 'csv') }
    ]); };
    if (!ro) {
      $('#e-add').onclick = () => this.addGuestDialog();

      $('#e-more').onclick = e => { e.stopPropagation(); const ev = S.events.get(this.id); showMenu($('#e-more'), [
        { label: 'עריכת פרטי האירוע', icon: ICON.edit, onClick: () => editEventDialog(ev) },
        { label: 'שכפול האירוע', icon: ICON.copy, onClick: () => duplicateEventDialog(ev) },
        '-',
        { label: 'איפוס כל הנוכחות', icon: ICON.reset, onClick: () => this.resetDialog() },
        { label: 'סיום האירוע ומחיקת השמות', icon: ICON.check, onClick: () => finishEventDialog(ev) },
        { label: 'מחיקת האירוע', icon: ICON.trash, danger: true, onClick: () => deleteEventDialog(ev) }
      ]); };
    }
    if (matchMedia('(min-width: 900px)').matches) setTimeout(() => q.focus(), 50);
  },
  computeList() {
    const ev = S.events.get(this.id); if (!ev) return [];
    const p = presentMap(ev.id);
    const qs = normName(this.q).toLowerCase();
    let list = (ev.guests || []).map(g => ({ id: g.id, g, at: p[g.id] || null }));
    if (this.filter === 'present') list = list.filter(x => x.at);
    if (this.filter === 'absent') list = list.filter(x => !x.at);
    if (qs) list = list.filter(x => { const f = normName(x.g?.first).toLowerCase(), l = normName(x.g?.last).toLowerCase(); return f.startsWith(qs) || l.startsWith(qs) || (f + ' ' + l).includes(qs) || (l + ' ' + f).includes(qs) || f.includes(qs) || l.includes(qs); });
    const byLast = (a, b) => collator.compare(a.g?.last || '', b.g?.last || '') || collator.compare(a.g?.first || '', b.g?.first || '');
    const byFirst = (a, b) => collator.compare(a.g?.first || '', b.g?.first || '') || collator.compare(a.g?.last || '', b.g?.last || '');
    const sorters = { last: byLast, 'last-desc': (a, b) => byLast(b, a), first: byFirst, 'first-desc': (a, b) => byFirst(b, a), status: (a, b) => (!!a.at - !!b.at) || byLast(a, b), recent: (a, b) => (b.at || 0) - (a.at || 0) || byLast(a, b) };
    list.sort(sorters[this.sort] || byLast);
    return list;
  },
  makeRow(id) {
    const el = document.createElement('label');
    el.className = 'g-row' + (S.canWrite ? '' : ' ro'); el.dataset.id = id;
    el.innerHTML = `<span class="g-check"><input type="checkbox" ${S.canWrite ? '' : 'disabled'}><span class="box">${ICON.check}</span></span><span class="g-first"></span><span class="g-last"></span><span class="g-status"></span><span class="g-time"></span><span>${S.canWrite ? `<button type="button" class="icon-btn g-remove" title="הסרה מהאירוע" aria-label="הסרה מהאירוע">${ICON.x}</button>` : ''}</span>`;
    el._c = el.querySelector('input'); el._f = el.querySelector('.g-first'); el._l = el.querySelector('.g-last'); el._s = el.querySelector('.g-status'); el._t = el.querySelector('.g-time');
    return el;
  },
  paintRow(el, x) {
    const on = !!x.at;
    if (el._on !== on) { el._on = on; el.classList.toggle('on', on); el._c.checked = on; el._s.innerHTML = on ? '<span class="pill ok">נוכח</span>' : '<span class="pill no">נעדר</span>'; el.setAttribute('aria-label', guestName(x.g) + (on ? ' — נוכח' : ' — נעדר')); }
    if (el._c.checked !== on) el._c.checked = on;
    const f = x.g.first || '—', l = x.g.last || '—';
    if (el._f.textContent !== f) el._f.textContent = f;
    if (el._l.textContent !== l) el._l.textContent = l;
    const tt = on ? fmtTime(x.at) : '';
    if (el._t.textContent !== tt) el._t.textContent = tt;
  },
  renderRows() {
    const body = $('#ci-body'); if (!body) return;
    const ev = S.events.get(this.id); if (!ev) return;
    const list = this.computeList();

    if (!total) {
      body.innerHTML = `<div class="empty"><div class="e-ico">${ICON.user}</div><h3>אין עדיין מוזמנים באירוע</h3><p>ייבאו רשימת מוזמנים מקובץ CSV או Excel, או הוסיפו אורחים ידנית.</p>${S.canWrite ? `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" type="button" id="em-imp">${ICON.up}ייבוא רשימה</button><button class="btn" type="button" id="em-add">${ICON.plus}הוספה ידנית</button></div>` : ''}</div>`;
      const b = $('#em-imp'); if (b) b.onclick = () => this.importDialog();

      $('#ci-count').textContent = ''; this.rowEls.clear(); return;
    }
    const shown = list.slice(0, this.limit);

    for (const x of shown) {
      let el = this.rowEls.get(x.id);
      if (!el) { el = this.makeRow(x.id); this.rowEls.set(x.id, el); }
      this.paintRow(el, x);
      frag.appendChild(el);
    }
    if (!list.length) { const d = document.createElement('div'); d.className = 'list-empty'; d.textContent = this.q ? 'לא נמצאו אורחים התואמים לחיפוש.' : (this.filter === 'present' ? 'עדיין לא סומנו נוכחים.' : 'כל המוזמנים סומנו כנוכחים 🎉'); frag.appendChild(d); }
    if (list.length > shown.length) { const d = document.createElement('div'); d.className = 'list-empty'; d.innerHTML = `<button type="button" class="btn" data-more>הצגת עוד ${fmtNum(Math.min(600, list.length - shown.length))} (מתוך ${fmtNum(list.length - shown.length)} נוספים)</button>`; frag.appendChild(d); }
    body.replaceChildren(frag);
    $('#ci-count').textContent = `מוצגים ${fmtNum(Math.min(list.length, shown.length))} מתוך ${fmtNum(total)} מוזמנים`;
  },
  refresh(ev) {
    $('#e-name').textContent = ev.name;
    const past = (ev.date || '') < todayStr();
    $('#e-meta').innerHTML = `<span>${fmtDate(ev.date)}${ev.time ? ' · ' + esc(ev.time) : ''}</span>${ev.location ? `<span>${esc(ev.location)}</span>` : ''}${past ? '<span class="pill no">אירוע היסטורי</span>' : (ev.date === todayStr() ? '<span class="pill ok">היום</span>' : '')}${ev.notes ? `<span title="${esc(ev.notes)}">📝 ${esc(trunc(ev.notes, 60))}</span>` : ''}`;
    const s = evStats(ev);
    $('#s-total').textContent = fmtNum(s.total);
    $('#s-present').textContent = fmtNum(s.present);
    $('#s-absent').textContent = fmtNum(s.absent);
    const pm = presentMap(ev.id), hourAgo = Date.now() - 3600000;
    let recent = 0; for (const g of ev.guests || []) if (pm[g.id] && pm[g.id] > hourAgo) recent++;
    $('#s-left').textContent = fmtNum(recent);
    $('#s-rate').textContent = fmtPct(s.rate);

  async removeGuest(gid) {
    const g = (S.events.get(this.id)?.guests || []).find(x => x.id === gid);
    const ok = await confirmDialog({ title: 'הסרת אורח מהאירוע', message: `להסיר את <b>${esc(guestName(g))}</b> מרשימת המוזמנים של אירוע זה?`, confirmLabel: 'הסרה', danger: true });
    if (!ok) return;
    try {
      await updateEventGuests(this.id, list => list.filter(x => x.id !== gid));
      if (presentMap(this.id)[gid]) setPresence(this.id, gid, false);
      toast('האורח הוסר מהאירוע', 'success');
    } catch (e) { toast(dbErrText(e), 'error'); }
  },
  addGuestDialog() { addGuestsDialog(this.id); },
  importDialog() {
    const eid = this.id;
    const wrap = document.createElement('div');
    let res = null;
    openModal({ title: 'ייבוא רשימת מוזמנים לאירוע', wide: true, body: wrap, actions: [
      { label: 'ייבוא', cls: 'primary', id: 'imp-go', onClick: async ({ el }) => {
        if (!res || !res.loaded) { toast('בחרו קובץ לייבוא', 'error'); return false; }
        if (!res.valid.length) { toast('אין שורות תקינות לייבוא', 'error'); return false; }
        try {
          let added = 0;
          await updateEventGuests(eid, cur => { const add = makeGuests(res.valid, eventKeys({ guests: cur })); added = add.length; return cur.concat(add); });
          toast(`יובאו ${fmtNum(added)} אורחים`, 'success');
        } catch (e) { toast(e.code ? dbErrText(e) : e.message, 'error'); return false; }
      } },

function buildPdf(d, charts, rangeLabel) {

  const pages = []; let c, ctx, y;

  const newPage = () => { c = document.createElement('canvas'); c.width = W; c.height = H; ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.direction = 'rtl'; ctx.textBaseline = 'alphabetic'; pages.push(c); y = M; };
  const text = (s, x, yy, { size = 20, w = 400, color = '#101828', align = 'right' } = {}) => { ctx.font = font(size, w); ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(String(s), x, yy); };
  const fit = (s, max, size, w = 400) => { ctx.font = font(size, w); s = String(s); if (ctx.measureText(s).width <= max) return s; while (s.length > 1 && ctx.measureText(s + '…').width > max) s = s.slice(0, -1); return s + '…'; };
  const r1 = n => fmtPct(n);
  newPage();
  ctx.fillStyle = '#1A2B4C'; ctx.fillRect(0, 0, W, 190);
  text('דוח נוכחות באירועים', R, 92, { size: 44, w: 700, color: '#fff' });
  text([S.settings.orgName, rangeLabel].filter(Boolean).join(' · '), R, 140, { size: 22, color: '#B9C7E2' });
  text('הופק: ' + new Date().toLocaleDateString('he-IL') + ' · ניהול נוכחות באירועים', M, 140, { size: 18, color: '#9FB1D6', align: 'left' });
  y = 240;
  const kp = [['אירועים', fmtNum(d.t.events)], ['מוזמנים', fmtNum(d.t.invited)], ['נוכחים', fmtNum(d.t.present)], ['נוכחות כוללת', r1(d.t.overall)], ['ממוצע לאירוע', r1(d.t.avg)]];
  const bw = (W - 2 * M - 4 * 16) / 5;
  kp.forEach((k, i) => { const x = R - i * (bw + 16); ctx.fillStyle = i === 4 ? '#1A2B4C' : '#F4F6F9'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - bw, y, bw, 120, 12) : ctx.rect(x - bw, y, bw, 120); ctx.fill(); text(k[0], x - 20, y + 42, { size: 19, color: i === 4 ? '#B9C7E2' : '#667085' }); text(k[1], x - 20, y + 95, { size: 38, w: 700, color: i === 4 ? '#fff' : '#1A2B4C' }); });
  y += 160;
  if (d.hi) { text('הנוכחות הגבוהה ביותר: ' + fit(d.hi.ev.name, 520, 21, 600) + ' — ' + r1(d.hi.rate), R, y, { size: 21, w: 600, color: '#0E7A55' }); y += 36; }
  if (d.lo) { text('הנוכחות הנמוכה ביותר: ' + fit(d.lo.ev.name, 520, 21, 600) + ' — ' + r1(d.lo.rate), R, y, { size: 21, w: 600, color: '#B54708' }); y += 36; }
  y += 20;
  const drawChart = (ch, title) => {
    if (!ch) return;
    const cw = W - 2 * M, chh = Math.round(cw * ch.canvas.height / ch.canvas.width);
    if (y + chh + 70 > H - M) { newPage(); }
    text(title, R, y + 24, { size: 24, w: 700 }); y += 44;
    ctx.drawImage(ch.canvas, M, y, cw, chh); y += chh + 40;
  };
  drawChart(charts[0], 'השוואת נוכחות בין אירועים');
  drawChart(charts[1], 'מגמת נוכחות חודשית');

    const rowH = 46;
    const header = () => { ctx.fillStyle = '#F4F6F9'; ctx.fillRect(M, y, W - 2 * M, rowH); let x = R; head.forEach((h, i) => { text(h, x - 14, y + 30, { size: 18, w: 600, color: '#667085' }); x -= widths[i]; }); y += rowH; };
    if (y + 140 > H - M) newPage();
    text(title, R, y + 24, { size: 24, w: 700 }); y += 44; header();
    rows.forEach(r => {
      if (y + rowH > H - M) { newPage(); header(); }
      let x = R; r.forEach((v, i) => { text(fit(v, widths[i] - 24, 18, i ? 400 : 600), x - 14, y + 30, { size: 18, w: i ? 400 : 600, color: '#101828' }); x -= widths[i]; });
      ctx.fillStyle = '#E4E7EC'; ctx.fillRect(M, y + rowH - 1, W - 2 * M, 1); y += rowH;

  table('פירוט לפי אירוע', ['שם האירוע', 'תאריך', 'מוזמנים', 'נוכחים', 'נעדרים', 'אחוז נוכחות'], [tw * .36, tw * .16, tw * .12, tw * .12, tw * .12, tw * .12], d.rows.slice().reverse().map(r => [r.ev.name, fmtDate(r.ev.date), fmtNum(r.total), fmtNum(r.present), fmtNum(r.absent), r1(r.rate)]));
  table('פירוט חודשי', ['חודש', 'אירועים', 'מוזמנים', 'נוכחים', 'אחוז נוכחות', 'ממוצע לאירוע'], [tw * .24, tw * .14, tw * .15, tw * .15, tw * .16, tw * .16], d.monthly.slice().reverse().map(m => [fmtMonth(m.ym), fmtNum(m.events), fmtNum(m.invited), fmtNum(m.present), r1(m.rate), r1(m.avg)]));
  pages.forEach((p, i) => { const cx = p.getContext('2d'); cx.direction = 'rtl'; cx.font = font(16); cx.fillStyle = '#98A2B3'; cx.textAlign = 'center'; cx.fillText(`עמוד ${i + 1} מתוך ${pages.length}`, W / 2, H - 36); });
  const { jsPDF } = window.jspdf;

  return pdf.output('arraybuffer');
}

          <p class="small muted" style="margin:0">המערכת נפתחת ישירות, ללא מסך כניסה. שמות המוזמנים נשמרים רק בתוך כל אירוע ונמחקים בלחיצה על "סיום אירוע". הנתונים נשמרים ב-Firebase Realtime Database, תחת ענף נפרד משאר המערכות בפרויקט.</p>
        </div></div>
        <div class="card"><div class="card-head"><h2>העדפות</h2></div><div class="card-pad">
          <div class="form-grid">
            <div class="field"><label>שם הארגון (יופיע בדוחות)</label><input class="input" id="st-org" maxlength="80" value="${esc(st.orgName || '')}"></div>
            <div class="field"><label>יעד אחוז נוכחות</label><input class="input" id="st-goal" type="number" min="0" max="100" step="1" value="${esc(st.goal)}"><span class="help">אירועים מתחת ליעד מסומנים בגוון בהיר בגרפים.</span></div>
            <div class="field"><label>מיון ברירת מחדל ברשימת הנוכחות</label><select class="input" id="st-sort"><option value="last">שם משפחה (א–ת)</option><option value="first">שם פרטי (א–ת)</option><option value="status">נעדרים תחילה</option></select></div>
            <div class="field full"><div class="err-msg" id="st-err"></div></div>
          </div>
          <button class="btn primary" id="st-save" ${S.canWrite ? '' : 'disabled'}>שמירת העדפות</button>
        </div></div>
        <div class="card"><div class="card-head"><h2>גיבוי וייצוא</h2></div><div class="card-pad" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="st-backup">${ICON.dl}גיבוי מלא (JSON)</button>
        </div></div>
        ${S.isOwner ? `<div class="card" style="border-color:#F6C9C5"><div class="card-head"><h2 style="color:var(--red)">אזור מסוכן</h2></div><div class="card-pad"><p class="small muted" style="margin-top:0">מחיקת כל האירועים ורשומות הנוכחות לצמיתות. מומלץ לבצע גיבוי לפני כן.</p><button class="btn danger" id="st-wipe">${ICON.trash}מחיקת כל הנתונים</button></div></div>` : ''}
        <div class="card"><div class="card-head"><h2>קיצורי עבודה בכניסה לאירוע</h2></div><div class="card-pad small">
          <p style="margin:0 0 6px">• הקלידו שם בשורת החיפוש ולחצו <span class="kbd">Enter</span> כשנותרה תוצאה אחת — האורח יסומן כנוכח והחיפוש יתנקה.</p>
          <p style="margin:0 0 6px">• לחיצה על כל השורה מסמנת/מבטלת נוכחות. <span class="kbd">Esc</span> מנקה את החיפוש.</p>
          <p style="margin:0 0 6px">• בסוף האירוע לחצו <b>סיום אירוע</b> — שמות המוזמנים נמחקים ונשמרים רק המספרים לדוחות.</p>
          <p style="margin:0">• כמה סדרנים יכולים לסמן במקביל ממכשירים שונים — העדכונים מסתנכרנים בזמן אמת.</p>
        </div></div>
      </div>`;
    $('#st-sort').value = st.defaultSort || 'last';
    $('#st-save').onclick = async () => {
      const goal = Number($('#st-goal').value), err = $('#st-err');
      if (!Number.isFinite(goal) || goal < 0 || goal > 100) { err.textContent = 'היעד חייב להיות מספר בין 0 ל-100.'; return; }
      err.textContent = '';
      const v = { orgName: normName($('#st-org').value), goal: Math.round(goal), defaultSort: $('#st-sort').value, updatedAt: Date.now() };
      try { await serial('settings/app', () => withRetry(() => S.db.doc('settings/app').set(v))); Object.assign(S.settings, v); changed(); toast('ההעדפות נשמרו', 'success'); }
      catch (e) { err.textContent = dbErrText(e); }
    };
    $('#st-backup').onclick = () => saveFile('גיבוי נוכחות ' + todayStr() + '.json', JSON.stringify({ exportedAt: new Date().toISOString(), settings: S.settings, events: [...S.events.values()], attendance: Object.fromEntries([...S.events.keys()].map(id => [id, presentMap(id)])) }, null, 2));
    const wipe = $('#st-wipe');
    if (wipe) wipe.onclick = async () => {
      const ok = await confirmDialog({ title: 'מחיקת כל הנתונים', message: `פעולה זו תמחק את כל ${fmtNum(S.events.size)} האירועים והנתונים שלהם לצמיתות.`, confirmLabel: 'מחיקה לצמיתות', danger: true, typeToConfirm: 'מחק הכל' });
      if (!ok) return;
      const prog = progressModal('מוחק נתונים');
      try {
        const jobs = [...S.events.keys()].flatMap(id => [refEvent(id), refAtt(id)]);
        await pool(jobs, 6, r => r.delete(), (d, t) => prog.set(`מוחק… ${fmtNum(d)} / ${fmtNum(t)}`, d / t));
        S.events.clear(); S.att.clear(); changed();
        prog.close(); toast('כל הנתונים נמחקו', 'success'); location.hash = 'dashboard';
      } catch (e) { prog.close(); toast(dbErrText(e), 'error'); }
    };
  },
  update() {}
};

/* ============ Router ============ */
const VIEWS = { dashboard: Dashboard, events: EventsView, create: CreateView, reports: ReportsView, prefs: SettingsView, event: EventView };
function route() {
  closeMenu();
  if (!S.db) return;
  let h = (location.hash || '').slice(1) || 'dashboard', name = h, param = null;
  if (h.startsWith('event-')) { name = 'event'; param = h.slice(6); }
  if (!VIEWS[name]) name = 'dashboard';
  try { current && current.destroy && current.destroy(); } catch (e) {}
  current = VIEWS[name];
  current.mount(main, param);
  try { current.update && current.update(); } catch (e) { console.error(e); }
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.r === (name === 'event' ? 'events' : name)));
  $('#side').classList.remove('open'); $('#scrim').classList.remove('show');
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('#menu-btn').onclick = () => { $('#side').classList.add('open'); $('#scrim').classList.add('show'); };
$('#scrim').onclick = () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('show'); };
function updateSideFoot() {
  const f = $('#side-foot'); if (!f) return;
  const name = S.me?.name || 'משתמש מחובר';
  f.innerHTML = `<div><span class="dot ${allReady() ? '' : 'off'}"></span><span class="who">${esc(name)}</span></div><div style="margin-top:3px">${allReady() ? `${fmtNum(S.events.size)} אירועים · ${fmtNum([...S.events.values()].filter(e => !e.closed).length)} פעילים` : 'מסנכרן נתונים…'}</div>`;
}

/* ============ Boot ============ */
/* ============ Firebase data layer (same interface the app uses) ============ */
function makeRtdb(fdb) {
  const mapErr = e => { const m = String((e && (e.code || e.message)) || '').toLowerCase(); return { code: m.includes('permission') ? 'invalid_argument' : 'unavailable', message: e && e.message }; };
  const wrap = p => p.catch(e => { throw mapErr(e); });
  const clean = o => JSON.parse(JSON.stringify(o));
  const flatten = (obj, pre = '', out = {}) => { for (const k in obj) { const v = obj[k]; if (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length) flatten(v, pre + k + '/', out); else out[pre + k] = v === undefined ? null : v; } return out; };
  const snapDoc = s => ({ id: s.key, exists: s.exists(), data: () => (s.exists() ? s.val() : undefined), metadata: {} });
  const docRef = path => {
    const ref = fdb.ref(ROOT + '/' + path);
    return {
      id: path.split('/').pop(), path,
      get: () => wrap(ref.get()).then(snapDoc),
      set: d => wrap(ref.set(clean(d))),
      update: d => wrap(ref.update(flatten(clean(d)))),
      delete: () => wrap(ref.remove()),
      onSnapshot(next, err) { const cb = s => next(snapDoc(s)); ref.on('value', cb, e => err && err(mapErr(e))); return () => ref.off('value', cb); }
    };
  };
  return {
    doc: docRef,
    collection: c => ({
      path: c, doc: id => docRef(c + '/' + id),
      onSnapshot(next, err) {
        const ref = fdb.ref(ROOT + '/' + c);
        const cb = s => { const v = s.val() || {}; const docs = Object.keys(v).map(id => ({ id, exists: true, data: () => v[id], metadata: {} })); next({ docs, size: docs.length, empty: !docs.length, metadata: {} }); };
        ref.on('value', cb, e => err && err(mapErr(e)));
        return () => ref.off('value', cb);
      }
    })
  };
}
const browserDownloads = {
  async save({ filename, data }) {
    const ext = (filename.split('.').pop() || '').toLowerCase();
    const types = { csv: 'text/csv;charset=utf-8', json: 'application/json', pdf: 'application/pdf', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
    const blob = data instanceof Blob ? data : new Blob([data], { type: types[ext] || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return { status: 'saved' };
  }
};

function showConfigGate(msg) {
  document.body.classList.add('locked');
  main.innerHTML = `<div class="gate card card-pad"><div class="empty" style="padding:20px"><h3>חסרות הגדרות Firebase</h3><p>${msg || 'פתחו את הקובץ index.html והדביקו את פרטי הפרויקט שלכם בבלוק firebaseConfig שבתחילת הסקריפט.'}</p></div></div>`;
}
function onDbError(e) {
  console.error(e);
  if (e && e.code === 'invalid_argument') setBanner('error', 'אין הרשאה לנתוני המערכת. בדקו את כללי האבטחה של attendanceApp ב-Realtime Database ← Rules.');
  else setBanner('error', 'החיבור למסד הנתונים נקטע. רעננו את העמוד.');
}
let started = false;
function startData(u) {
  if (started) return; started = true;
  document.body.classList.remove('locked');
  S.db = makeRtdb(firebase.database()); S.dl = browserDownloads; S.isOwner = true; S.canWrite = true;
  S.me = { name: 'מחובר' };
  const db = S.db;
  route();
  const timer = setTimeout(() => { if (!allReady()) setBanner('warn', 'לא ניתן להגיע למסד הנתונים כרגע. הנתונים יוצגו ברגע שהחיבור יחזור.'); }, 10000);
  const ok = () => { if (allReady()) { clearTimeout(timer); if (globalBanner && globalBanner.type === 'warn') setBanner(null); } };
  db.collection('events').onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { const x = d.data() || {}; m.set(d.id, Object.assign({ id: d.id }, x, { guests: Array.isArray(x.guests) ? x.guests.filter(Boolean).slice() : (x.guests && typeof x.guests === 'object' ? Object.values(x.guests).filter(Boolean) : []) })); });
    S.events = m; S.ready.events = true; ok(); changed();
  }, onDbError);
  db.collection('attendance').onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { const p = (d.data() || {}).present; m.set(d.id, p && typeof p === 'object' ? Object.assign({}, p) : {}); });
    for (const [eid, ov] of S.overlay) { const base = m.get(eid) || {}; for (const k in ov) { const q = WQ.get(eid); const pending = q && (k in q.pending || q.busy); if (!pending && !!base[k] === !!ov[k]) delete ov[k]; } }
    for (const eid of S.events.keys()) if (!m.has(eid)) m.set(eid, {});
    S.att = m; S.ready.att = true; ok(); changed();
  }, onDbError);
  db.doc('settings/app').onSnapshot(snap => {
    if (snap.exists) S.settings = Object.assign({ goal: 70, orgName: '', defaultSort: 'last' }, snap.data());
    changed();
  }, () => {});
  updateSideFoot();
}
function boot() {
  setupChartDefaults();
  if (!window.firebase) { showConfigGate('רכיבי Firebase לא נטענו. בדקו את החיבור לאינטרנט ורעננו.'); return; }
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('PASTE')) { showConfigGate(); return; }
  firebase.initializeApp(firebaseConfig);
  // No login screen: the app signs in silently (Anonymous Auth) so the database rules can still require a signed-in app.
  firebase.auth().onAuthStateChanged(u => {
    if (u) { startData(u); return; }
    firebase.auth().signInAnonymously().catch(e => {
      console.error(e);
      showConfigGate(/operation-not-allowed|admin-restricted/.test((e && e.code) || '') ? 'יש להפעיל כניסה אנונימית ב-Firebase: Authentication ← Sign-in method ← Anonymous ← Enable.' : 'לא ניתן להתחבר ל-Firebase. בדקו את החיבור לאינטרנט ואת פרטי firebaseConfig.');
    });
  });
}
boot();
</script>
